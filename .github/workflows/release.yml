name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # 添加这行以匹配带有后缀的版本号

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vue app
        run: npm run build

      - name: Zip Vue dist (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          7z a dist.zip ./*
          cd ..

      - name: Zip Vue dist (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          zip -r dist.zip ./*
          cd ..

      - name: Build Electron app
        run: npm run electron:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            buileder/*
            dist/dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
